<body><h3>פרוטוקול מנהלת העם 12.5.1948</h3><p>דוד בן גוריון, גולדה מאירסון, ישראל גלילי, משה שרתוק. לחצו על כל אחת מהדמויות וקראו את דבריה.</p>
<p>ישראל גלילי: "סכנת הפלישה של צבאות ערב מוקטנת בעיני הבריטים".</p></body></html>
